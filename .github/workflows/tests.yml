name: Python tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run game tests
        run: python -m pytest -v test_game.py
        working-directory: "abc-2026/Занятие от 14.10.2026/Лабораторная №6/pytest_lab"
